<main class="login-page">
  <section class="login-card">
    <h1>Booking System</h1>
    <p class="subtitle">Sign in with your account credentials</p>

    <form (ngSubmit)="login(loginForm)" #loginForm="ngForm" novalidate>
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        required
        [(ngModel)]="username"
        #usernameModel="ngModel"
        placeholder="Enter username"
      />
      <small *ngIf="usernameModel.invalid && usernameModel.touched" class="error">
        Username is required.
      </small>

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        required
        [(ngModel)]="password"
        #passwordModel="ngModel"
        placeholder="Enter password"
      />
      <small *ngIf="passwordModel.invalid && passwordModel.touched" class="error">
        Password is required.
      </small>

      <button type="submit" [disabled]="loginForm.invalid || isSubmitting">
        {{ isSubmitting ? 'Signing in...' : 'Login' }}
      </button>
    </form>

    <p *ngIf="message" [class.success]="isSuccess" [class.error]="!isSuccess">
      {{ message }}
    </p>
  </section>
</main>
