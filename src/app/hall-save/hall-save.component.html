<main class="hall-page">
  <section class="hall-card">
    <h1>Hall Save / Update</h1>
    <p class="subtitle">Load an active hall, edit details, and save the update.</p>

    <div class="toolbar">
      <button type="button" class="secondary" (click)="loadActiveHalls()" [disabled]="isLoadingActive">
        {{ isLoadingActive ? 'Loading...' : 'Reload Active Halls' }}
      </button>
    </div>

    <label for="hallSelector">Select active hall</label>
    <select
      name="hallSelector"
      [(ngModel)]="selectedHallId"
      (ngModelChange)="onHallSelect()"
    >
      <option value="">-- select a hall --</option>
      @for (activeHall of activeHalls; track activeHall.id) {
        <option [value]="activeHall.id">{{ activeHall.name }} ({{ activeHall.location }})</option>
      }
    </select>

    <form (ngSubmit)="saveHall()" #hallForm="ngForm" novalidate>

      <label for="name">Name</label>
      <input id="name" name="name" type="text" required [(ngModel)]="hall.name" />

      <label for="description">Description</label>
      <textarea
        id="description"
        name="description"
        required
        rows="3"
        [(ngModel)]="hall.description"
      ></textarea>

      <label for="location">Location</label>
      <input id="location" name="location" type="text" required [(ngModel)]="hall.location" />

      <label for="capacity">Capacity</label>
      <input id="capacity" name="capacity" type="number" min="1" required [(ngModel)]="hall.capacity" />

      <div class="checks">
        <label><input type="checkbox" name="hasProjector" [(ngModel)]="hall.hasProjector" /> Has projector</label>
        <label><input type="checkbox" name="hasAc" [(ngModel)]="hall.hasAc" /> Has AC</label>
        <label><input type="checkbox" name="hasWhiteboard" [(ngModel)]="hall.hasWhiteboard" /> Has whiteboard</label>
        <label><input type="checkbox" name="status" [(ngModel)]="hall.status" /> Active status</label>
      </div>

      <button type="submit" [disabled]="hallForm.invalid || isSaving">
        {{ isSaving ? 'Saving...' : 'Save / Update Hall' }}
      </button>
    </form>

    <p *ngIf="message" [class.success]="isSuccess" [class.error]="!isSuccess">{{ message }}</p>
  </section>
</main>
