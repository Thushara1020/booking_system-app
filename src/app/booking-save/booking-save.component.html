<main class="booking-page">
  <section class="booking-card">
    <h1>Booking Save</h1>
    <p class="subtitle">Create and save a hall booking using the booking API.</p>

    <form (ngSubmit)="saveBooking()" #bookingForm="ngForm" novalidate>
      <label for="reservedDate">Reserved Date</label>
      <input id="reservedDate" name="reservedDate" type="date" required [(ngModel)]="booking.reservedDate" />

      <label for="startTime">Start Time</label>
      <input id="startTime" name="startTime" type="time" required [(ngModel)]="booking.startTime" />

      <label for="endTime">End Time</label>
      <input id="endTime" name="endTime" type="time" required [(ngModel)]="booking.endTime" />

      <label for="bookingFor">Booking For</label>
      <input id="bookingFor" name="bookingFor" type="text" required [(ngModel)]="booking.bookingFor" />

      <label for="expectedParticipants">Expected Participants</label>
      <input id="expectedParticipants" name="expectedParticipants" type="number" min="1" required [(ngModel)]="booking.expectedParticipants" />

      <label for="specialRequirements">Special Requirements</label>
      <textarea
        id="specialRequirements"
        name="specialRequirements"
        rows="3"
        required
        [(ngModel)]="booking.specialRequirements"
      ></textarea>

      <button type="submit" [disabled]="bookingForm.invalid || isSaving">
        {{ isSaving ? 'Saving...' : 'Save Booking' }}
      </button>
    </form>

    <p *ngIf="message" [class.success]="isSuccess" [class.error]="!isSuccess">{{ message }}</p>
  </section>
</main>
